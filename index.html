<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/physio-logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2E8BC0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Physio+" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Physio+ Clinic</title>
    <!-- Fonts — loaded non-blocking so they never delay first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@400;500;600&family=Cairo:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@400;500;600&family=Cairo:wght@400;500;600;700&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Outfit:wght@400;500;600&family=Cairo:wght@400;500;600;700&display=swap" /></noscript>
    <!-- Firebase preconnect -->
    <link rel="preconnect" href="https://firestore.googleapis.com" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" />
    <!-- Instant loading indicator — visible before any JS executes -->
    <style>
      #phub-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fafaf8;z-index:9999;transition:opacity .2s}
      #phub-boot svg{animation:phub-spin .9s linear infinite}
      @keyframes phub-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
      #phub-boot p{margin:14px 0 0;font-size:13px;color:#9a9590;font-family:system-ui,sans-serif;letter-spacing:.02em}
    </style>
  </head>
  <body>
    <div id="phub-boot">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2E8BC0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <p>Physio+ Clinic</p>
    </div>
    <div id="root"></div>
    <script>
      // Remove the boot screen once React has rendered something into #root
      var _phubObs = new MutationObserver(function(){
        var r = document.getElementById('root');
        if(r && r.firstChild){
          var b = document.getElementById('phub-boot');
          if(b){ b.style.opacity='0'; setTimeout(function(){b.remove()},200); }
          _phubObs.disconnect();
        }
      });
      _phubObs.observe(document.getElementById('root'), {childList:true});
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
