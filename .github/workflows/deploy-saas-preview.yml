name: Deploy saas branch → Preview Channel

on:
  push:
    branches:
      - saas

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Deploy to Firebase Hosting preview channel
        run: npx firebase-tools hosting:channel:deploy saas --project physio-hub-ae4c9 --token "${{ secrets.FIREBASE_TOKEN }}" --expires 30d
